bind-key -n C-w new-window -c "#{pane_current_path}"

# Let applications inside tmux send escape sequences straight through to the
# outer terminal (ghostel).  Required for ghostel's OSC 7 directory tracking
# and OSC 51 (ghostel_cmd) helpers, which ~/.bashrc passthrough-wraps when $TMUX
# is set.  tmux 3.3+.
set -g allow-passthrough on

# Track the mouse so wheel/touchpad scroll enters tmux copy-mode and scrolls the
# pane content while the status line stays pinned at the bottom.  ghostel
# forwards wheel events to tmux as button 4/5 only when the app requests mouse
# tracking; without this it scrolls ghostel's own grid (status line included).
set -g mouse on

# Persist per-project tab layouts: whenever a window is added, removed, or
# renamed, record the projectile/* session's tab names so `bb' (in ~/.bashrc)
# restores them next time.  High array indices avoid clobbering any byobu hooks.
set-hook -g 'window-linked[50]'   'run -b "~/.config/byobu/bin/bb-save-layout"'
set-hook -g 'window-unlinked[50]' 'run -b "~/.config/byobu/bin/bb-save-layout"'
set-hook -g 'window-renamed[50]'  'run -b "~/.config/byobu/bin/bb-save-layout"'

# Modern-TUI rendering for apps run inside tmux (e.g. Claude Code in the `you'
# tab).  byobu defaults to screen-256color with no truecolor, which makes Ink's
# background-colored layout spaces vanish and forces non-atomic redraws.
#  * tmux-256color  — advertise a capable TERM to inner apps.
#  * xterm-ghostty:RGB  — ghostel (libghostty) is truecolor; pass 24-bit through.
#  * xterm-ghostty:sync — synchronized output (DEC 2026): atomic, flicker-free,
#                         much faster redraws for heavy TUIs.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:sync:clipboard"

# Send copy-mode selections to the outer terminal's clipboard via OSC 52.  A
# mouse drag is forwarded to tmux (it requests mouse tracking), so tmux — not
# ghostel — owns the selection; with this on, tmux's copy-selection also emits
# OSC 52, which ghostel honors (`ghostel-enable-osc52 t') and writes to the
# Emacs kill ring + system clipboard.  The `:clipboard' terminal-feature above
# tells tmux the outer xterm-ghostty terminal supports OSC 52.
set -g set-clipboard on

# Auto-follow-resize: when the same session is attached from several clients
# (e.g. the Emacs ghostel buffer AND a separate terminal / VS Code via `bb'),
# size the windows to the most-recently-active client instead of the smallest,
# so a small extra client doesn't shrink the others.
set -g window-size latest

# Minimal status line: just the window tabs, centered.  Empty left/right plus
# centre justification override byobu's own indicators (this user config is
# sourced after byobu's profile, so it wins).
set -g status-left ""
set -g status-right ""
set -g status-justify centre
# Active window tab: no background highlight, just a brighter bold name — the
# same foreground as the Emacs active buffer name.  (byobu's bright default
# background pulled the eye off the buffer.)
set -g window-status-current-style "fg=#e3e7ee,bold"
