bind-key -n C-w new-window -c "#{pane_current_path}"

# Let applications inside tmux send escape sequences straight through to the
# outer terminal (ghostel).  Required for ghostel's OSC 7 directory tracking
# and OSC 51 (ghostel_cmd) helpers, which ~/.bashrc passthrough-wraps when $TMUX
# is set.  tmux 3.3+.
set -g allow-passthrough on

# Track the mouse so wheel/touchpad scroll enters tmux copy-mode and scrolls the
# pane content while the status line stays pinned at the bottom.  ghostel
# forwards wheel events to tmux as button 4/5 only when the app requests mouse
# tracking; without this it scrolls ghostel's own grid (status line included).
set -g mouse on

# Persist per-project tab layouts: whenever a window is added, removed, or
# renamed, record the projectile/* session's tab names so `bb' (in ~/.bashrc)
# restores them next time.  High array indices avoid clobbering any byobu hooks.
set-hook -g 'window-linked[50]'   'run -b "~/.config/byobu/bin/bb-save-layout"'
set-hook -g 'window-unlinked[50]' 'run -b "~/.config/byobu/bin/bb-save-layout"'
set-hook -g 'window-renamed[50]'  'run -b "~/.config/byobu/bin/bb-save-layout"'

# Modern-TUI rendering for apps run inside tmux (e.g. the assistant in the
# `leticode' tab).  byobu defaults to screen-256color with no truecolor, which
# makes a TUI's background-colored layout spaces vanish and forces non-atomic
# redraws.
#  * tmux-256color  — advertise a capable TERM to inner apps.
#  * xterm-ghostty:RGB  — ghostel (libghostty) is truecolor; pass 24-bit through.
#  * xterm-ghostty:sync — synchronized output (DEC 2026): atomic, flicker-free,
#                         much faster redraws for heavy TUIs.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:sync:clipboard"

# Send copy-mode selections to the outer terminal's clipboard via OSC 52.  A
# mouse drag is forwarded to tmux (it requests mouse tracking), so tmux — not
# ghostel — owns the selection; with this on, tmux's copy-selection also emits
# OSC 52, which ghostel honors (`ghostel-enable-osc52 t') and writes to the
# Emacs kill ring + system clipboard.  The `:clipboard' terminal-feature above
# tells tmux the outer xterm-ghostty terminal supports OSC 52.
set -g set-clipboard on

# Auto-follow-resize: when the same session is attached from several clients
# (e.g. the Emacs ghostel buffer AND a separate terminal / VS Code via `bb'),
# size the windows to the most-recently-active client instead of the smallest,
# so a small extra client doesn't shrink the others.
set -g window-size latest

# Minimal status line: just the window tabs, centered.  Empty left/right plus
# centre justification override byobu's own indicators (this user config is
# sourced after byobu's profile, so it wins).
set -g status-left ""
set -g status-right ""
set -g status-justify centre
# The BAR itself, from the palette.  byobu's default is a flat `#333333/#EEEEEE'
# grey that belongs to no palette, and the band it sits against -- Emacs's mode
# line, one row below -- is slot 0 of the terminal's: two near-greys that don't
# quite agree read as a seam.  Same pair `letibot-gray-theme.el' gives the mode
# line (0 = #2f363b, 7 = #c4c9cc), and the same principle as everything else here:
# a colour is a slot of Ghostty's LetibotGray, never a hand-picked hex.
set -g status-style "bg=#2f363b,fg=#c4c9cc"
# Window tabs as plain text -- no grey boxes (byobu boxes every non-active window
# with bg=#333333, which left the active, box-less tab looking recessed).  Active
# is bright + bold (same fg as the Emacs active buffer name); inactive is dim
# (slot 8, the palette's `faint'); a window with activity (the `#' I/O flag) is a
# touch brighter (slot 7, the bar's own fg).  Only the active tab is bold, so it
# stands out.  Slots rather than hand-picked greys, so tabs and frame cannot
# drift apart.
set -g window-status-style          "fg=#7d868b"
set -g window-status-current-style  "fg=#eef1f2,bold"
set -g window-status-activity-style "fg=#c4c9cc"
# Everything else byobu draws in colour still comes from its Ubuntu palette:
# aubergine `#75507B' for the copy-mode selection, the message line and the pane
# borders, orange `#DD4814' for the active border.  Same rule as the bar -- take
# the slot.  The copy-mode selection gets the palette's SELECTION pair, which is
# also what Ghostty puts behind a selection and what `region' gets in Emacs, so
# scrolling here and selecting there look alike; the message line is the bar's own
# background with a slot-3 warning on it; borders are the raised tone, the active
# one a step brighter.
set -g mode-style                "bg=#34424e,fg=#eef1f2"
set -g message-style             "bg=#2f363b,fg=#e0b040"
set -g pane-border-style         "fg=#34424e"
set -g pane-active-border-style  "fg=#7d868b"
set -g clock-mode-colour         "#6fbcbf"

# Don't forward the audible terminal BEL out to the host terminal -- byobu
# defaults to `bell-action any' with `visual-bell off', so any tab's beep (a
# readline bell, etc.) reaches Konsole, which pops a "bell in session" notice.
# Ignore bells, matching Emacs's visible-bell preference.  (Activity is still
# shown via `monitor-activity' + the style above.)
set -g bell-action none
